<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVA MARKET — My Orders</title>

    <meta
        name="description"
        content="View and manage your NOVA MARKET orders."
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg: #05060a;
            --bg-soft: #090c14;
            --card: #0d121d;

            --border: rgba(255,255,255,.08);

            --text: #ffffff;
            --text-soft: #aab3c7;
            --text-muted: #737d91;

            --blue: #536dff;
            --purple: #8b5cf6;
            --green: #2bd98b;
            --yellow: #f5c451;
            --red: #ff5c7a;
            --cyan: #51d8ff;

            --radius: 20px;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family: "Inter", sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(83,109,255,.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 0%,
                    rgba(139,92,246,.10),
                    transparent 28%
                ),
                var(--bg);
        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 80%
                );

            z-index: -1;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button,
        input,
        select {
            font-family: inherit;
        }


        .container {

            width:
                min(
                    1380px,
                    calc(100% - 40px)
                );

            margin: 0 auto;

            padding-bottom: 70px;
        }


        /* =========================================
           NAVBAR
        ========================================= */

        .navbar {

            min-height: 78px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            border-bottom:
                1px solid
                rgba(255,255,255,.05);
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 11px;
        }


        .brand-logo {

            width: 43px;
            height: 43px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            font-size: 19px;

            font-weight: 800;

            box-shadow:
                0 12px 30px
                rgba(83,109,255,.22);
        }


        .brand-name {

            font-size: 18px;

            font-weight: 800;

            letter-spacing: -.5px;
        }


        .brand-name span {
            color: #8290ff;
        }


        .nav-actions {

            display: flex;

            align-items: center;

            gap: 9px;
        }


        .nav-link {

            padding:
                10px 13px;

            border:
                1px solid var(--border);

            border-radius: 11px;

            color:
                var(--text-soft);

            font-size: 11px;

            font-weight: 600;

            transition:
                .2s ease;
        }


        .nav-link:hover {

            color: white;

            border-color:
                rgba(83,109,255,.35);
        }


        /* =========================================
           HEADER
        ========================================= */

        .page-header {

            padding:
                48px 0 30px;
        }


        .eyebrow {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-bottom:
                12px;

            color:
                #92a0ff;

            font-size: 10px;

            font-weight: 700;

            text-transform:
                uppercase;

            letter-spacing:
                1.3px;
        }


        .eyebrow::before {

            content: "";

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                var(--blue);

            box-shadow:
                0 0 15px
                rgba(83,109,255,.7);
        }


        .page-header h1 {

            font-size:
                clamp(
                    34px,
                    5vw,
                    52px
                );

            line-height:
                1.05;

            letter-spacing:
                -1.8px;

            margin-bottom:
                12px;
        }


        .page-header p {

            max-width:
                720px;

            color:
                var(--text-muted);

            font-size:
                13px;

            line-height:
                1.8;
        }


        /* =========================================
           TOOLBAR
        ========================================= */

        .toolbar {

            display: flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap: 15px;

            margin-bottom:
                22px;
        }


        .filters {

            display: flex;

            align-items:
                center;

            gap: 9px;
        }


        .filter {

            padding:
                10px 13px;

            border:
                1px solid var(--border);

            border-radius:
                11px;

            background:
                rgba(255,255,255,.025);

            color:
                var(--text-soft);

            outline: none;

            cursor: pointer;

            font-size:
                11px;
        }


        .refresh-btn {

            padding:
                10px 14px;

            border:
                1px solid var(--border);

            border-radius:
                11px;

            background:
                rgba(255,255,255,.025);

            color:
                #ced5e5;

            cursor:
                pointer;

            font-size:
                11px;

            font-weight:
                700;

            transition:
                .2s ease;
        }


        .refresh-btn:hover {

            color: white;

            border-color:
                rgba(83,109,255,.35);
        }


        /* =========================================
           STATS
        ========================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            gap: 12px;

            margin-bottom:
                22px;
        }


        .stat {

            padding:
                18px;

            border:
                1px solid var(--border);

            border-radius:
                16px;

            background:
                rgba(255,255,255,.025);
        }


        .stat-label {

            color:
                var(--text-muted);

            font-size:
                9px;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

            margin-bottom:
                9px;
        }


        .stat-value {

            font-size:
                24px;

            font-weight:
                800;
        }


        /* =========================================
           ORDERS LIST
        ========================================= */

        .orders-list {

            display:
                grid;

            gap:
                14px;
        }


        .order-card {

            display:
                grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto;

            gap:
                20px;

            padding:
                21px;

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.035),
                    rgba(255,255,255,.012)
                );

            transition:
                .2s ease;
        }


        .order-card:hover {

            border-color:
                rgba(83,109,255,.25);

            transform:
                translateY(-2px);
        }


        .order-main {

            min-width:
                0;
        }


        .order-top {

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

            gap:
                15px;

            margin-bottom:
                14px;
        }


        .service-info {

            min-width:
                0;
        }


        .service-category {

            display:
                inline-flex;

            margin-bottom:
                8px;

            padding:
                5px 8px;

            border-radius:
                999px;

            background:
                rgba(83,109,255,.09);

            color:
                #91a0ff;

            font-size:
                9px;

            font-weight:
                700;
        }


        .service-title {

            font-size:
                18px;

            line-height:
                1.35;

            margin-bottom:
                6px;
        }


        .order-id {

            color:
                var(--text-muted);

            font-size:
                9px;

            word-break:
                break-all;
        }


        /* =========================================
           STATUS
        ========================================= */

        .status {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            flex:
                0 0 auto;

            padding:
                7px 10px;

            border-radius:
                999px;

            font-size:
                9px;

            font-weight:
                700;

            text-transform:
                capitalize;
        }


        .status-dot {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                currentColor;
        }


        .status-pending {

            background:
                rgba(245,196,81,.09);

            color:
                var(--yellow);
        }


        .status-accepted {

            background:
                rgba(81,216,255,.09);

            color:
                var(--cyan);
        }


        .status-in_progress {

            background:
                rgba(83,109,255,.09);

            color:
                #8999ff;
        }


        .status-delivered {

            background:
                rgba(139,92,246,.10);

            color:
                #ae8aff;
        }


        .status-completed {

            background:
                rgba(43,217,139,.09);

            color:
                var(--green);
        }


        .status-cancelled,
        .status-rejected {

            background:
                rgba(255,92,122,.09);

            color:
                var(--red);
        }


        /* =========================================
           DETAILS
        ========================================= */

        .details-grid {

            display:
                grid;

            grid-template-columns:
                repeat(4,minmax(0,1fr));

            gap:
                9px;
        }


        .detail {

            padding:
                12px;

            border:
                1px solid var(--border);

            border-radius:
                12px;

            background:
                rgba(255,255,255,.02);
        }


        .detail-label {

            color:
                var(--text-muted);

            font-size:
                8px;

            margin-bottom:
                5px;
        }


        .detail-value {

            color:
                #e9edf6;

            font-size:
                11px;

            font-weight:
                700;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;
        }


        /* =========================================
           WORKER
        ========================================= */

        .worker-mini {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            margin-top:
                12px;
        }


        .worker-avatar {

            width:
                29px;

            height:
                29px;

            flex:
                0 0 29px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

            border-radius:
                9px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            color:
                white;

            font-size:
                9px;

            font-weight:
                800;
        }


        .worker-avatar img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;
        }


        .worker-name {

            max-width:
                200px;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            color:
                #c2cadb;

            font-size:
                10px;

            font-weight:
                600;
        }


        /* =========================================
           ACTIONS
        ========================================= */

        .order-actions {

            min-width:
                150px;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            gap:
                9px;
        }


        .action-btn {

            width:
                100%;

            padding:
                11px 13px;

            border:
                1px solid var(--border);

            border-radius:
                11px;

            cursor:
                pointer;

            background:
                rgba(255,255,255,.025);

            color:
                #d3d9e6;

            font-size:
                10px;

            font-weight:
                700;

            transition:
                .2s ease;
        }


        .action-btn:hover {

            border-color:
                rgba(83,109,255,.3);

            color:
                white;
        }


        .cancel-btn {

            border-color:
                rgba(255,92,122,.16);

            color:
                #ff8ba0;

            background:
                rgba(255,92,122,.045);
        }


        .cancel-btn:hover {

            border-color:
                rgba(255,92,122,.35);

            background:
                rgba(255,92,122,.08);
        }


        .cancel-btn:disabled {

            opacity:
                .5;

            cursor:
                not-allowed;
        }


        /* =========================================
           EMPTY / LOADING
        ========================================= */

        .state {

            padding:
                80px 20px;

            text-align:
                center;

            border:
                1px solid var(--border);

            border-radius:
                20px;

            background:
                rgba(255,255,255,.02);
        }


        .state-icon {

            width:
                58px;

            height:
                58px;

            margin:
                0 auto 16px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                18px;

            background:
                rgba(83,109,255,.08);

            color:
                #8d9cff;

            font-size:
                24px;

            font-weight:
                800;
        }


        .state h3 {

            font-size:
                17px;

            margin-bottom:
                8px;
        }


        .state p {

            max-width:
                520px;

            margin:
                0 auto;

            color:
                var(--text-muted);

            font-size:
                11px;

            line-height:
                1.7;
        }


        .spinner {

            width:
                40px;

            height:
                40px;

            margin:
                0 auto 15px;

            border:
                3px solid
                rgba(255,255,255,.07);

            border-top-color:
                var(--blue);

            border-radius:
                50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* =========================================
           TOAST
        ========================================= */

        .toast {

            position:
                fixed;

            left:
                50%;

            bottom:
                22px;

            z-index:
                999;

            min-width:
                280px;

            padding:
                14px 17px;

            border:
                1px solid var(--border);

            border-radius:
                13px;

            background:
                rgba(14,18,29,.96);

            backdrop-filter:
                blur(18px);

            box-shadow:
                0 25px 60px rgba(0,0,0,.4);

            color:
                white;

            text-align:
                center;

            font-size:
                11px;

            font-weight:
                600;

            opacity:
                0;

            transform:
                translate(-50%,20px);

            pointer-events:
                none;

            transition:
                .25s ease;
        }


        .toast.show {

            opacity:
                1;

            transform:
                translate(-50%,0);
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1000px) {

            .stats {

                grid-template-columns:
                    repeat(2,1fr);
            }


            .details-grid {

                grid-template-columns:
                    repeat(2,1fr);
            }
        }


        @media (max-width: 800px) {

            .order-card {

                grid-template-columns:
                    1fr;
            }


            .order-actions {

                min-width:
                    0;

                flex-direction:
                    row;
            }


            .order-actions
            .action-btn {

                flex:
                    1;
            }
        }


        @media (max-width: 600px) {

            .container {

                width:
                    calc(100% - 24px);
            }


            .nav-link {

                display:
                    none;
            }


            .page-header {

                padding-top:
                    35px;
            }


            .toolbar {

                align-items:
                    stretch;

                flex-direction:
                    column;
            }


            .filters {

                width:
                    100%;
            }


            .filter {

                flex:
                    1;
            }


            .stats {

                grid-template-columns:
                    repeat(2,1fr);
            }


            .order-top {

                flex-direction:
                    column;
            }


            .details-grid {

                grid-template-columns:
                    1fr 1fr;
            }


            .order-actions {

                flex-direction:
                    column;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <!-- NAVBAR -->

        <header class="navbar">

            <a
                href="../index.html"
                class="brand"
            >

                <div class="brand-logo">
                    N
                </div>

                <div class="brand-name">
                    NOVA<span>MARKET</span>
                </div>

            </a>


            <div class="nav-actions">

                <a
                    href="../services.html"
                    class="nav-link"
                >
                    Services
                </a>


                <a
                    href="../dashboard.html"
                    class="nav-link"
                >
                    Dashboard
                </a>

            </div>

        </header>


        <!-- HEADER -->

        <section class="page-header">

            <div class="eyebrow">
                Customer Dashboard
            </div>

            <h1>
                My Orders
            </h1>

            <p>
                Track your services, workers, prices,
                delivery times and order status from one place.
            </p>

        </section>


        <!-- TOOLBAR -->

        <div class="toolbar">

            <div class="filters">

                <select
                    id="statusFilter"
                    class="filter"
                >

                    <option value="all">
                        All Orders
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="accepted">
                        Accepted
                    </option>

                    <option value="in_progress">
                        In Progress
                    </option>

                    <option value="delivered">
                        Delivered
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                    <option value="cancelled">
                        Cancelled
                    </option>

                    <option value="rejected">
                        Rejected
                    </option>

                </select>

            </div>


            <button
                id="refreshOrdersBtn"
                type="button"
                class="refresh-btn"
            >
                ↻ Refresh Orders
            </button>

        </div>


        <!-- STATS -->

        <section
            id="stats"
            class="stats"
        >

            <div class="stat">

                <div class="stat-label">
                    Total Orders
                </div>

                <div
                    id="totalOrders"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Active
                </div>

                <div
                    id="activeOrders"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Completed
                </div>

                <div
                    id="completedOrders"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Total Spent
                </div>

                <div
                    id="totalSpent"
                    class="stat-value"
                >
                    0 MAD
                </div>

            </div>

        </section>


        <!-- ORDERS -->

        <main
            id="ordersList"
            class="orders-list"
        >

            <div class="state">

                <div class="spinner"></div>

                <h3>
                    Loading your orders...
                </h3>

            </div>

        </main>

    </div>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
    ></div>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script
        src="../js/supabase-config.js?v=12"
    ></script>


    <script
        src="../js/orders.js?v=12"
    ></script>

</body>
</html>
