<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — NOVA MARKET</title>

    <meta
        name="description"
        content="Create your NOVA MARKET account."
    >

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =====================================================
           NOVA MARKET — REGISTER
           ===================================================== */

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(37, 99, 235, .16),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(124, 58, 237, .18),
                    transparent 35%
                ),
                #050507;
        }

        .auth-background {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .auth-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .35;
        }

        .auth-orb-one {
            width: 280px;
            height: 280px;
            background: #2563eb;
            top: -100px;
            left: -80px;
        }

        .auth-orb-two {
            width: 320px;
            height: 320px;
            background: #7c3aed;
            right: -120px;
            bottom: -120px;
        }

        .auth-container {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 2;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo a {
            color: #fff;
            text-decoration: none;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .auth-logo span {
            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #8b5cf6
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-card {
            width: 100%;
            padding: 38px;
            border-radius: 26px;

            background: rgba(15, 15, 22, .88);

            border: 1px solid rgba(255,255,255,.09);

            box-shadow:
                0 30px 80px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.04);

            backdrop-filter: blur(25px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: #fff;
            font-size: 30px;
            margin: 0 0 10px;
        }

        .auth-header p {
            color: #9292a5;
            margin: 0;
            font-size: 14px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #e7e7ef;
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 52px;

            box-sizing: border-box;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,.09);

            background: rgba(255,255,255,.045);

            color: #fff;

            outline: none;

            padding: 0 16px;

            font-size: 14px;

            transition: .25s ease;
        }

        .input-wrapper input::placeholder {
            color: #666677;
        }

        .input-wrapper input:focus {
            border-color: rgba(96,165,250,.8);

            background: rgba(255,255,255,.065);

            box-shadow:
                0 0 0 4px rgba(59,130,246,.10);
        }

        .input-wrapper input.valid {
            border-color: rgba(34,197,94,.55);
        }

        .input-wrapper input.invalid {
            border-color: rgba(239,68,68,.55);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            border: 0;
            background: transparent;

            color: #888899;

            cursor: pointer;

            padding: 7px;
        }

        .password-toggle:hover {
            color: #fff;
        }

        .password-strength {
            display: none;
            gap: 5px;
            margin-top: 3px;
        }

        .password-strength.show {
            display: flex;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            border-radius: 10px;
            background: rgba(255,255,255,.08);
            transition: .25s ease;
        }

        .strength-text {
            font-size: 11px;
            color: #777788;
            margin-top: 3px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;

            color: #9292a5;

            font-size: 12px;

            line-height: 1.6;
        }

        .terms input {
            margin-top: 3px;
            accent-color: #6366f1;
            flex-shrink: 0;
        }

        .terms a {
            color: #8b9cff;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .auth-submit {
            width: 100%;
            height: 54px;

            border: 0;
            border-radius: 15px;

            cursor: pointer;

            color: #fff;

            font-size: 15px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:
                0 12px 30px rgba(79,70,229,.28);

            transition: .25s ease;
        }

        .auth-submit:hover {
            transform: translateY(-2px);

            box-shadow:
                0 18px 40px rgba(79,70,229,.38);
        }

        .auth-submit:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;

            gap: 14px;

            margin: 24px 0;

            color: #666677;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: rgba(255,255,255,.08);
        }

        .google-btn {
            width: 100%;
            height: 52px;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,.10);

            background: rgba(255,255,255,.045);

            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 700;

            transition: .25s ease;
        }

        .google-btn:hover {
            background: rgba(255,255,255,.08);

            border-color:
                rgba(255,255,255,.18);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .auth-footer {
            text-align: center;

            margin-top: 26px;

            color: #858596;

            font-size: 14px;
        }

        .auth-footer a {
            color: #8b9cff;

            text-decoration: none;

            font-weight: 700;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .auth-message {
            display: none;

            padding: 13px 15px;

            border-radius: 12px;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 18px;
        }

        .auth-message.show {
            display: block;
        }

        .auth-message.error {
            color: #fecaca;

            background:
                rgba(239,68,68,.10);

            border:
                1px solid rgba(239,68,68,.22);
        }

        .auth-message.success {
            color: #bbf7d0;

            background:
                rgba(34,197,94,.10);

            border:
                1px solid rgba(34,197,94,.22);
        }

        @media (max-width: 560px) {

            .auth-card {
                padding: 27px 20px;
                border-radius: 20px;
            }

            .name-row {
                grid-template-columns: 1fr;
                gap: 17px;
            }

            .auth-header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <!-- BACKGROUND -->

        <div class="auth-background">

            <div class="auth-orb auth-orb-one"></div>

            <div class="auth-orb auth-orb-two"></div>

        </div>


        <div class="auth-container">

            <!-- LOGO -->

            <div class="auth-logo">

                <a href="index.html">
                    N<span>OVA</span>
                </a>

            </div>


            <!-- CARD -->

            <section class="auth-card">

                <!-- HEADER -->

                <div class="auth-header">

                    <h1>
                        Create your account
                    </h1>

                    <p>
                        Join NOVA MARKET and start building.
                    </p>

                </div>


                <!-- MESSAGE -->

                <div
                    id="authMessage"
                    class="auth-message"
                    role="alert"
                ></div>


                <!-- FORM -->

                <form
                    id="registerForm"
                    class="auth-form"
                    novalidate
                >

                    <!-- FIRST + LAST NAME -->

                    <div class="name-row">

                        <div class="form-group">

                            <label for="firstName">
                                First name
                            </label>

                            <div class="input-wrapper">

                                <input
                                    type="text"
                                    id="firstName"
                                    name="firstName"
                                    placeholder="First name"
                                    autocomplete="given-name"
                                    required
                                    minlength="2"
                                >

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="lastName">
                                Last name
                            </label>

                            <div class="input-wrapper">

                                <input
                                    type="text"
                                    id="lastName"
                                    name="lastName"
                                    placeholder="Last name"
                                    autocomplete="family-name"
                                    required
                                    minlength="2"
                                >

                            </div>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a strong password"
                                autocomplete="new-password"
                                required
                                minlength="8"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password"
                            >
                                👁
                            </button>

                        </div>

                        <div
                            class="password-strength"
                            id="passwordStrength"
                        >

                            <span class="strength-bar"></span>

                            <span class="strength-bar"></span>

                            <span class="strength-bar"></span>

                            <span class="strength-bar"></span>

                        </div>

                        <div
                            class="strength-text"
                            id="strengthText"
                        ></div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm password
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Repeat your password"
                                autocomplete="new-password"
                                required
                                minlength="8"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleConfirmPassword"
                                aria-label="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- TERMS -->

                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#" id="termsLink">
                                Terms of Service
                            </a>
                            and
                            <a href="#" id="privacyLink">
                                Privacy Policy
                            </a>.
                        </span>

                    </label>


                    <!-- CREATE ACCOUNT -->

                    <button
                        type="submit"
                        class="auth-submit"
                        id="registerButton"
                    >

                        <span id="registerButtonText">
                            Create account
                        </span>

                    </button>

                </form>


                <!-- DIVIDER -->

                <div class="divider">
                    OR
                </div>


                <!-- GOOGLE -->

                <button
                    type="button"
                    class="google-btn"
                    id="googleRegister"
                >

                    <svg
                        class="google-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            fill="#4285F4"
                            d="M21.35 12.23c0-.79-.07-1.55-.23-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.93-4.18 2.93-7.4z"
                        />

                        <path
                            fill="#34A853"
                            d="M12 21.75c2.63 0 4.84-.87 6.45-2.35l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.55 0-4.71-1.72-5.49-4.04H3.27v2.52A9.75 9.75 0 0 0 12 21.75z"
                        />

                        <path
                            fill="#FBBC05"
                            d="M6.51 13.84A5.86 5.86 0 0 1 6.2 12c0-.64.11-1.26.31-1.84V7.64H3.27A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.02 4.36l3.24-2.52z"
                        />

                        <path
                            fill="#EA4335"
                            d="M12 6.12c1.43 0 2.72.49 3.74 1.46l2.8-2.8C16.84 3.2 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.73 5.39l3.24 2.52C7.29 7.84 9.45 6.12 12 6.12z"
                        />

                    </svg>

                    Continue with Google

                </button>


                <!-- LOGIN -->

                <div class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>

            </section>

        </div>

    </main>


    <!-- AUTH JS -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
