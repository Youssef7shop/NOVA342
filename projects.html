<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVA — Projects</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #06070b;
            --card: #0d1018;
            --border: rgba(255,255,255,.08);
            --text: #fff;
            --muted: #8c93a5;
            --blue: #3977ff;
            --purple: #8b5cf6;
            --danger: #ff4d67;
        }

        body {
            min-height: 100vh;
            font-family: Inter, sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 80% 0%,
                    rgba(57,119,255,.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 20% 20%,
                    rgba(139,92,246,.10),
                    transparent 30%
                ),
                var(--bg);
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        .loading {
            position: fixed;
            inset: 0;
            background: #05060a;
            display: grid;
            place-items: center;
            z-index: 9999;
            transition: .3s;
        }

        .loading.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,.1);
            border-top-color: var(--blue);
            border-right-color: var(--purple);
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .page {
            width: min(1150px, calc(100% - 36px));
            margin: auto;
            padding: 28px 0 60px;
        }

        /* HEADER */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .brand {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 800;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );
        }

        .back {
            color: white;
            text-decoration: none;
            padding: 11px 15px;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 11px;
            font-size: 13px;
            font-weight: 600;
        }

        /* TITLE */

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 32px;
            letter-spacing: -.9px;
        }

        .heading p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 7px;
        }

        .create-btn {
            border: none;
            color: white;
            cursor: pointer;
            padding: 12px 18px;
            border-radius: 11px;
            font-weight: 700;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );
        }

        /* GRID */

        .projects {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .project-card {
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 19px;
            padding: 20px;
            min-height: 190px;
            display: flex;
            flex-direction: column;
            transition: .2s;
        }

        .project-card:hover {
            transform: translateY(-3px);
            border-color: rgba(57,119,255,.28);
        }

        .project-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .project-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );
        }

        .status {
            padding: 6px 8px;
            border-radius: 7px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status.active {
            color: #72e5bc;
            background: rgba(53,212,154,.1);
        }

        .status.completed {
            color: #78a4ff;
            background: rgba(57,119,255,.1);
        }

        .status.archived {
            color: #a4a9b5;
            background: rgba(255,255,255,.06);
        }

        .project-card h3 {
            font-size: 15px;
            margin-top: 17px;
        }

        .project-card p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
            margin-top: 7px;
        }

        .project-footer {
            margin-top: auto;
            padding-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .date {
            color: #60687a;
            font-size: 10px;
        }

        .delete-btn {
            border: none;
            background: rgba(255,77,103,.08);
            color: #ff7185;
            border-radius: 8px;
            padding: 7px 9px;
            cursor: pointer;
            font-size: 11px;
        }

        /* EMPTY */

        .empty {
            grid-column: 1 / -1;
            border: 1px dashed rgba(255,255,255,.1);
            border-radius: 20px;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: rgba(57,119,255,.1);
            font-size: 25px;
        }

        .empty h3 {
            font-size: 16px;
        }

        .empty p {
            color: var(--muted);
            font-size: 12px;
            margin-top: 7px;
        }

        /* MODAL */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.72);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: min(500px, 100%);
            background: #0d1018;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 30px 100px rgba(0,0,0,.5);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 18px;
        }

        .close {
            border: none;
            background: rgba(255,255,255,.06);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #c9ceda;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            border: 1px solid var(--border);
            background: #090c13;
            color: white;
            outline: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
        }

        .field textarea {
            min-height: 110px;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: rgba(57,119,255,.65);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel {
            border: 1px solid var(--border);
            background: transparent;
            color: white;
            padding: 11px 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        .submit {
            border: none;
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );
        }

        /* TOAST */

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            background: #111522;
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            transition: .25s;
            z-index: 2000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* RESPONSIVE */

        @media(max-width: 900px) {

            .projects {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media(max-width: 600px) {

            .page {
                width: calc(100% - 24px);
            }

            .heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .create-btn {
                width: 100%;
            }

            .projects {
                grid-template-columns: 1fr;
            }

            .heading h1 {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>

<div class="loading" id="loading">
    <div class="loader"></div>
</div>


<div class="page">

    <header class="topbar">

        <a
            href="dashboard.html"
            class="brand"
        >
            <span class="brand-icon">N</span>
            NOVA
        </a>

        <a
            href="dashboard.html"
            class="back"
        >
            ← Dashboard
        </a>

    </header>


    <section class="heading">

        <div>

            <h1>
                My Projects
            </h1>

            <p>
                Create and manage your projects from your NOVA workspace.
            </p>

        </div>

        <button
            class="create-btn"
            id="openCreate"
        >
            + New Project
        </button>

    </section>


    <section
        class="projects"
        id="projectsList"
    >

        <div class="empty">

            <div class="empty-icon">
                ◈
            </div>

            <h3>
                Loading projects...
            </h3>

            <p>
                Please wait.
            </p>

        </div>

    </section>

</div>


<!-- CREATE PROJECT MODAL -->

<div
    class="modal"
    id="createModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Create New Project
            </h2>

            <button
                class="close"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <form id="projectForm">

            <div class="field">

                <label for="projectName">
                    Project Name
                </label>

                <input
                    id="projectName"
                    type="text"
                    placeholder="My new project"
                    maxlength="100"
                    required
                >

            </div>


            <div class="field">

                <label for="projectDescription">
                    Description
                </label>

                <textarea
                    id="projectDescription"
                    placeholder="Describe your project..."
                    maxlength="1000"
                ></textarea>

            </div>


            <div class="field">

                <label for="projectStatus">
                    Status
                </label>

                <select id="projectStatus">

                    <option value="active">
                        Active
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                    <option value="archived">
                        Archived
                    </option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel"
                    id="cancelModal"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="submit"
                    id="submitProject"
                >
                    Create Project
                </button>

            </div>

        </form>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/projects.js"></script>

</body>

</html>
