<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA MARKET — Services</title>

    <meta
        name="description"
        content="Discover professional digital services on NOVA MARKET."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --bg: #05060a;
            --bg-soft: #090c14;
            --card: #0d121d;

            --border: rgba(255,255,255,.08);
            --border-hover: rgba(83,109,255,.35);

            --text: #ffffff;
            --text-soft: #aab3c7;
            --text-muted: #727c90;

            --blue: #536dff;
            --purple: #8b5cf6;
            --green: #2bd98b;

            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family: "Inter", sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(83,109,255,.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 0%,
                    rgba(139,92,246,.11),
                    transparent 28%
                ),
                var(--bg);
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 75%
                );

            z-index: -1;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .container {
            width: min(1380px, calc(100% - 40px));
            margin: 0 auto;
        }

        /* ==========================================
           NAVBAR
        ========================================== */

        .navbar {
            min-height: 74px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            border-bottom:
                1px solid rgba(255,255,255,.05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            font-size: 19px;
            font-weight: 800;

            box-shadow:
                0 12px 30px rgba(83,109,255,.24);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -.5px;
        }

        .brand-name span {
            color: #8290ff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link {
            padding: 10px 14px;

            border: 1px solid var(--border);
            border-radius: 11px;

            color: var(--text-soft);

            font-size: 12px;
            font-weight: 600;

            transition: .2s ease;
        }

        .nav-link:hover {
            color: white;
            border-color: var(--border-hover);
        }

        .profile-btn {
            display: flex;
            align-items: center;
            gap: 9px;

            padding: 6px 10px 6px 6px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: rgba(255,255,255,.025);
        }

        .profile-avatar {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            font-size: 12px;
            font-weight: 800;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-text {
            font-size: 11px;
            font-weight: 700;
            color: #d8deec;
        }

        /* ==========================================
           HERO
        ========================================== */

        .hero {
            padding: 70px 0 38px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 15px;

            color: #93a0ff;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 1.3px;
        }

        .eyebrow::before {
            content: "";

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--blue);

            box-shadow:
                0 0 16px rgba(83,109,255,.7);
        }

        .hero h1 {
            max-width: 760px;

            font-size:
                clamp(36px, 5vw, 62px);

            line-height: 1.04;

            letter-spacing: -2px;

            margin-bottom: 17px;
        }

        .hero h1 span {
            background:
                linear-gradient(
                    135deg,
                    #6b82ff,
                    #9b72ff
                );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            max-width: 700px;

            color: var(--text-muted);

            font-size: 15px;
            line-height: 1.8;
        }

        /* ==========================================
           FILTERS
        ========================================== */

        .filters {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                220px;

            gap: 12px;

            margin-bottom: 30px;
        }

        .search-box,
        .category-box {
            height: 50px;

            display: flex;
            align-items: center;

            border:
                1px solid var(--border);

            border-radius: 14px;

            background:
                rgba(255,255,255,.025);
        }

        .search-box {
            position: relative;
        }

        .search-icon {
            width: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--text-muted);

            font-size: 16px;
        }

        .search-box input {
            width: 100%;
            height: 100%;

            border: 0;
            outline: 0;

            background: transparent;

            color: white;

            font-size: 13px;
        }

        .search-box input::placeholder {
            color: #677084;
        }

        .category-box select {
            width: 100%;
            height: 100%;

            padding: 0 15px;

            border: 0;
            outline: 0;

            background: transparent;

            color: #d8deec;

            font-size: 12px;

            cursor: pointer;
        }

        .category-box select option {
            color: #111;
        }

        /* ==========================================
           GRID
        ========================================== */

        .services-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;

            padding-bottom: 70px;
        }

        .service-card {
            overflow: hidden;

            border:
                1px solid var(--border);

            border-radius: var(--radius);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.035),
                    rgba(255,255,255,.012)
                );

            transition:
                transform .25s ease,
                border-color .25s ease,
                box-shadow .25s ease;
        }

        .service-card:hover {
            transform: translateY(-5px);

            border-color:
                var(--border-hover);

            box-shadow:
                0 25px 70px rgba(0,0,0,.35);
        }

        .service-image {
            position: relative;

            height: 215px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #111b3b,
                    #29144b
                );
        }

        .service-image img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition: transform .35s ease;
        }

        .service-card:hover
        .service-image img {
            transform: scale(1.04);
        }

        .service-placeholder {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 25% 20%,
                    rgba(83,109,255,.3),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 75% 80%,
                    rgba(139,92,246,.25),
                    transparent 40%
                ),
                #0a1022;

            color: white;

            font-size: 60px;
            font-weight: 800;
        }

        .service-content {
            padding: 22px;
        }

        .category {
            display: inline-flex;

            padding: 6px 9px;

            margin-bottom: 11px;

            border-radius: 999px;

            background:
                rgba(83,109,255,.09);

            color: #91a0ff;

            font-size: 10px;
            font-weight: 700;
        }

        .service-title {
            min-height: 44px;

            font-size: 18px;
            line-height: 1.3;

            margin-bottom: 10px;
        }

        .service-description {
            min-height: 57px;

            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;

            overflow: hidden;

            color: var(--text-muted);

            font-size: 12px;
            line-height: 1.65;

            margin-bottom: 18px;
        }

        .service-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding-bottom: 16px;

            border-bottom:
                1px solid var(--border);
        }

        .price {
            color: white;

            font-size: 19px;
            font-weight: 800;
        }

        .delivery {
            color: var(--text-muted);

            font-size: 11px;
            font-weight: 600;
        }

        .service-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            padding-top: 16px;
        }

        .worker {
            min-width: 0;

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .worker-avatar {
            width: 30px;
            height: 30px;

            flex: 0 0 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            object-fit: cover;

            font-size: 10px;
            font-weight: 800;
        }

        .worker-name {
            max-width: 115px;

            overflow: hidden;

            text-overflow: ellipsis;
            white-space: nowrap;

            color: #bcc4d5;

            font-size: 11px;
            font-weight: 600;
        }

        .view-btn {
            padding: 10px 13px;

            border: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            color: white;

            cursor: pointer;

            font-size: 11px;
            font-weight: 800;

            transition: .2s ease;
        }

        .view-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(83,109,255,.22);
        }

        /* ==========================================
           STATES
        ========================================== */

        .loader {
            grid-column: 1 / -1;

            min-height: 350px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--text-muted);

            font-size: 13px;
        }

        .empty {
            grid-column: 1 / -1;

            padding: 70px 20px;

            text-align: center;

            border:
                1px solid var(--border);

            border-radius: 20px;

            background:
                rgba(255,255,255,.02);
        }

        .empty h3 {
            font-size: 20px;

            margin-bottom: 9px;
        }

        .empty p {
            color: var(--text-muted);

            font-size: 13px;
            line-height: 1.6;
        }

        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 1050px) {
            .services-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {

            .container {
                width: min(100% - 24px, 1380px);
            }

            .navbar {
                min-height: 65px;
            }

            .nav-link {
                display: none;
            }

            .profile-text {
                display: none;
            }

            .hero {
                padding: 48px 0 28px;
            }

            .hero h1 {
                font-size: 38px;
                letter-spacing: -1.5px;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .service-image {
                height: 235px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- NAVBAR -->
        <header class="navbar">

            <a href="index.html" class="brand">

                <div class="brand-logo">
                    N
                </div>

                <div class="brand-name">
                    NOVA<span>MARKET</span>
                </div>

            </a>


            <div class="nav-right">

                <a
                    href="dashboard.html"
                    class="nav-link"
                >
                    Dashboard
                </a>


                <a
                    href="worker-services.html"
                    class="nav-link"
                >
                    My Services
                </a>


                <a
                    href="profile.html"
                    class="profile-btn"
                >

                    <div
                        id="profileInitial"
                        class="profile-avatar"
                    >
                        N
                    </div>

                    <span class="profile-text">
                        Account
                    </span>

                </a>

                <img
                    id="profileImage"
                    src=""
                    alt=""
                    style="
                        display:none;
                    "
                >

            </div>

        </header>


        <!-- HERO -->
        <section class="hero">

            <div class="eyebrow">
                NOVA Marketplace
            </div>

            <h1>
                Discover
                <span>Professional Services.</span>
            </h1>

            <p>
                Find digital professionals, explore their
                services, compare pricing and choose the
                solution that fits your project.
            </p>

        </section>


        <!-- FILTERS -->
        <section class="filters">

            <div class="search-box">

                <div class="search-icon">
                    ⌕
                </div>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search services, categories or keywords..."
                    autocomplete="off"
                >

            </div>


            <div class="category-box">

                <select id="categoryFilter">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Web Development">
                        Web Development
                    </option>

                    <option value="Design">
                        Design
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                    <option value="Video">
                        Video
                    </option>

                    <option value="Writing">
                        Writing
                    </option>

                    <option value="Programming">
                        Programming
                    </option>

                    <option value="AI">
                        AI
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

        </section>


        <!-- SERVICES -->
        <section
            id="servicesGrid"
            class="services-grid"
        >

            <div class="loader">
                Loading services...
            </div>

        </section>

    </div>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="./js/supabase-config.js?v=10"
    ></script>

    <script
        src="./js/services.js?v=10"
    ></script>

</body>
</html>
