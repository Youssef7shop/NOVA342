<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA MARKET — Services</title>

    <meta
        name="description"
        content="Discover professional digital services on NOVA MARKET."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050509;
            --panel: #0d0d14;
            --panel-2: #11111a;
            --border: rgba(255,255,255,.09);
            --text: #ffffff;
            --muted: #9a9aaa;
            --blue: #4d7cff;
            --purple: #8b5cf6;
            --danger: #ff4d6d;
            --success: #22c55e;
        }

        body {
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(77,124,255,.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(139,92,246,.12),
                    transparent 30%
                ),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .navbar {
            height: 74px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(5,5,9,.75);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--blue);
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 14px;
            transition: .2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: white;
        }

        .profile-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: linear-gradient(
                135deg,
                rgba(77,124,255,.2),
                rgba(139,92,246,.2)
            );
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        .profile-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .container {
            width: min(1400px, 90%);
            margin: auto;
        }

        .hero {
            padding: 80px 0 45px;
        }

        .eyebrow {
            color: var(--blue);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(38px, 6vw, 72px);
            line-height: 1;
            letter-spacing: -3px;
            max-width: 800px;
        }

        .hero p {
            color: var(--muted);
            max-width: 650px;
            margin-top: 22px;
            line-height: 1.7;
            font-size: 16px;
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 15px;
            margin: 30px 0 35px;
        }

        .search-box,
        .filter-select {
            background: rgba(255,255,255,.04);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: white;
            padding: 15px 17px;
            outline: none;
        }

        .search-box:focus,
        .filter-select:focus {
            border-color: rgba(77,124,255,.7);
        }

        .filter-select option {
            background: #101018;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            padding-bottom: 80px;
        }

        .service-card {
            border: 1px solid var(--border);
            background: linear-gradient(
                145deg,
                rgba(255,255,255,.055),
                rgba(255,255,255,.018)
            );
            border-radius: 22px;
            overflow: hidden;
            transition: transform .25s, border-color .25s;
        }

        .service-card:hover {
            transform: translateY(-6px);
            border-color: rgba(77,124,255,.4);
        }

        .service-image {
            height: 190px;
            background:
                linear-gradient(
                    135deg,
                    rgba(77,124,255,.25),
                    rgba(139,92,246,.3)
                );
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .service-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .service-placeholder {
            font-size: 55px;
            font-weight: 800;
            opacity: .9;
        }

        .service-content {
            padding: 22px;
        }

        .category {
            display: inline-block;
            font-size: 11px;
            color: #b8c7ff;
            background: rgba(77,124,255,.12);
            border: 1px solid rgba(77,124,255,.2);
            padding: 6px 9px;
            border-radius: 999px;
            margin-bottom: 14px;
        }

        .service-title {
            font-size: 19px;
            line-height: 1.35;
            margin-bottom: 10px;
        }

        .service-description {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            min-height: 42px;
        }

        .service-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        .price {
            font-size: 21px;
            font-weight: 800;
        }

        .delivery {
            color: var(--muted);
            font-size: 12px;
        }

        .service-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
        }

        .worker {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .worker-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: #191923;
        }

        .worker-name {
            font-size: 12px;
            color: #d7d7df;
        }

        .view-btn {
            border: 0;
            color: white;
            background: linear-gradient(
                135deg,
                var(--blue),
                var(--purple)
            );
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            border: 1px dashed var(--border);
            border-radius: 20px;
            color: var(--muted);
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px;
            color: var(--muted);
        }

        @media (max-width: 1000px) {
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .nav-links {
                display: none;
            }

            .hero {
                padding-top: 55px;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                letter-spacing: -2px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">
        NOVA<span>.</span>
    </a>

    <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="services.html" class="active">Services</a>
        <a href="projects.html">Projects</a>
        <a href="profile.html">Profile</a>
    </nav>

    <a href="profile.html" class="profile-btn">
        <span id="profileInitial">N</span>
        <img id="profileImage" alt="Profile" style="display:none;">
    </a>
</header>

<main class="container">

    <section class="hero">
        <div class="eyebrow">NOVA MARKET</div>

        <h1>
            Find the right
            <span style="
                background:linear-gradient(90deg,#4d7cff,#8b5cf6);
                -webkit-background-clip:text;
                color:transparent;
            ">
                digital service.
            </span>
        </h1>

        <p>
            Discover talented workers and professional digital services
            for websites, design, development, marketing, video and more.
        </p>
    </section>

    <section class="filters">

        <input
            id="searchInput"
            class="search-box"
            type="search"
            placeholder="Search services..."
        >

        <select id="categoryFilter" class="filter-select">
            <option value="all">All categories</option>
            <option value="Web Development">Web Development</option>
            <option value="Design">Design</option>
            <option value="Video">Video</option>
            <option value="Marketing">Marketing</option>
            <option value="Writing">Writing</option>
            <option value="AI">AI</option>
            <option value="Other">Other</option>
        </select>

    </section>

    <section id="servicesGrid" class="services-grid">
        <div class="loader">
            Loading services...
        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/services.js"></script>

</body>
</html>
