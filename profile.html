<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA — My Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #06070b;
            --card: #0d1018;
            --card2: #111522;
            --border: rgba(255,255,255,.08);
            --text: #fff;
            --muted: #8c93a5;
            --blue: #3977ff;
            --purple: #8b5cf6;
            --danger: #ff4d67;
            --success: #35d49a;
        }

        body {
            min-height: 100vh;
            font-family: Inter, sans-serif;
            color: var(--text);
            background:
                radial-gradient(
                    circle at 80% 0%,
                    rgba(57,119,255,.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 20% 20%,
                    rgba(139,92,246,.10),
                    transparent 30%
                ),
                var(--bg);
        }

        button,
        input {
            font-family: inherit;
        }

        .loading {
            position: fixed;
            inset: 0;
            background: #05060a;
            display: grid;
            place-items: center;
            z-index: 9999;
            transition: .3s;
        }

        .loading.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,.1);
            border-top-color: var(--blue);
            border-right-color: var(--purple);
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .page {
            width: min(1100px, calc(100% - 36px));
            margin: auto;
            padding: 30px 0 60px;
        }

        /* HEADER */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 800;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: linear-gradient(
                135deg,
                var(--blue),
                var(--purple)
            );
        }

        .back-btn {
            border: 1px solid var(--border);
            background: var(--card);
            color: white;
            text-decoration: none;
            padding: 11px 15px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 600;
        }

        .back-btn:hover {
            border-color: rgba(255,255,255,.2);
        }

        /* HERO */

        .hero {
            border: 1px solid var(--border);
            background:
                linear-gradient(
                    135deg,
                    rgba(57,119,255,.13),
                    rgba(139,92,246,.08)
                ),
                var(--card);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 20px;
        }

        .avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .avatar {
            width: 105px;
            height: 105px;
            border-radius: 28px;
            object-fit: cover;
            display: block;
            background: linear-gradient(
                135deg,
                var(--blue),
                var(--purple)
            );
            border: 3px solid rgba(255,255,255,.08);
        }

        .camera-btn {
            position: absolute;
            right: -5px;
            bottom: -5px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid var(--card);
            background: linear-gradient(
                135deg,
                var(--blue),
                var(--purple)
            );
            color: white;
            cursor: pointer;
        }

        .hero-info h1 {
            font-size: 28px;
            letter-spacing: -.8px;
        }

        .hero-info p {
            color: var(--muted);
            margin-top: 6px;
            font-size: 14px;
        }

        .badges {
            display: flex;
            gap: 8px;
            margin-top: 13px;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(57,119,255,.12);
            color: #79a2ff;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge.plan {
            background: rgba(139,92,246,.12);
            color: #c1a2ff;
        }

        /* GRID */

        .grid {
            display: grid;
            grid-template-columns: 1.3fr .7fr;
            gap: 20px;
        }

        .card {
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .card-description {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 23px;
        }

        /* FORM */

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #c9ceda;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            border: 1px solid var(--border);
            background: #090c13;
            color: white;
            padding: 13px 14px;
            border-radius: 11px;
            outline: none;
            font-size: 13px;
            transition: .2s;
        }

        .field input:focus {
            border-color: rgba(57,119,255,.65);
            box-shadow: 0 0 0 3px rgba(57,119,255,.08);
        }

        .field input:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 5px;
        }

        .save-btn {
            border: none;
            color: white;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 11px;
            font-weight: 700;
            background: linear-gradient(
                135deg,
                var(--blue),
                var(--purple)
            );
        }

        .save-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        /* ACCOUNT */

        .account-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .account-item:last-child {
            border-bottom: none;
        }

        .account-label {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 5px;
        }

        .account-value {
            font-size: 13px;
            font-weight: 700;
            word-break: break-word;
        }

        .plan-box {
            margin-top: 18px;
            border: 1px solid rgba(139,92,246,.2);
            background: rgba(139,92,246,.07);
            padding: 16px;
            border-radius: 14px;
        }

        .plan-box strong {
            display: block;
            font-size: 13px;
        }

        .plan-box span {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 5px;
        }

        .upgrade-btn {
            width: 100%;
            margin-top: 12px;
            border: 1px solid rgba(139,92,246,.3);
            background: transparent;
            color: #c6a8ff;
            padding: 10px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .logout-btn {
            width: 100%;
            margin-top: 18px;
            border: 1px solid rgba(255,77,103,.2);
            background: rgba(255,77,103,.06);
            color: #ff7185;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        /* TOAST */

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            max-width: 350px;
            padding: 14px 18px;
            border-radius: 12px;
            background: #111522;
            border: 1px solid var(--border);
            color: white;
            font-size: 13px;
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            transition: .25s;
            z-index: 99999;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            border-color: rgba(53,212,154,.25);
        }

        .toast.error {
            border-color: rgba(255,77,103,.3);
        }

        /* MOBILE */

        @media(max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .hero {
                align-items: flex-start;
            }
        }

        @media(max-width: 600px) {
            .page {
                width: min(100% - 24px, 1100px);
                padding-top: 18px;
            }

            .topbar {
                margin-bottom: 18px;
            }

            .hero {
                padding: 20px;
                flex-direction: column;
                text-align: center;
            }

            .badges {
                justify-content: center;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .card {
                padding: 18px;
            }

            .hero-info h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="loading" id="loading">
    <div class="loader"></div>
</div>

<div class="page">

    <!-- HEADER -->

    <header class="topbar">

        <a href="dashboard.html" class="brand">
            <span class="brand-icon">N</span>
            NOVA
        </a>

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </header>


    <!-- PROFILE HERO -->

    <section class="hero">

        <div class="avatar-wrapper">

            <img
                id="profileAvatar"
                class="avatar"
                src="https://ui-avatars.com/api/?name=NOVA"
                alt="Profile"
            >

            <button
                type="button"
                class="camera-btn"
                id="avatarBtn"
                title="Change profile picture"
            >
                ✎
            </button>

            <input
                type="file"
                id="avatarInput"
                accept="image/png,image/jpeg,image/webp"
                hidden
            >

        </div>

        <div class="hero-info">

            <h1 id="heroName">
                Loading...
            </h1>

            <p id="heroEmail">
                Loading...
            </p>

            <div class="badges">

                <span
                    class="badge"
                    id="roleBadge"
                >
                    CUSTOMER
                </span>

                <span
                    class="badge plan"
                    id="planBadge"
                >
                    FREE
                </span>

            </div>

        </div>

    </section>


    <!-- CONTENT -->

    <div class="grid">

        <!-- PERSONAL INFORMATION -->

        <section class="card">

            <div class="card-title">
                Personal Information
            </div>

            <div class="card-description">
                Update the information displayed on your NOVA account.
            </div>

            <form id="profileForm">

                <div class="form-row">

                    <div class="field">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            id="firstName"
                            type="text"
                            placeholder="First name"
                            autocomplete="given-name"
                        >

                    </div>

                    <div class="field">

                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            id="lastName"
                            type="text"
                            placeholder="Last name"
                            autocomplete="family-name"
                        >

                    </div>

                </div>

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        disabled
                    >

                </div>

                <div class="form-actions">

                    <button
                        class="save-btn"
                        id="saveBtn"
                        type="submit"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </section>


        <!-- ACCOUNT -->

        <aside class="card">

            <div class="card-title">
                Account
            </div>

            <div class="card-description">
                Your NOVA account details.
            </div>

            <div class="account-item">

                <div class="account-label">
                    ACCOUNT ID
                </div>

                <div
                    class="account-value"
                    id="accountId"
                >
                    —
                </div>

            </div>

            <div class="account-item">

                <div class="account-label">
                    ROLE
                </div>

                <div
                    class="account-value"
                    id="accountRole"
                >
                    Customer
                </div>

            </div>

            <div class="account-item">

                <div class="account-label">
                    PLAN
                </div>

                <div
                    class="account-value"
                    id="accountPlan"
                >
                    Free
                </div>

            </div>

            <div class="plan-box">

                <strong>
                    NOVA Free Plan
                </strong>

                <span>
                    Upgrade later to unlock additional features.
                </span>

                <button
                    class="upgrade-btn"
                    id="upgradeBtn"
                    type="button"
                >
                    View Plans
                </button>

            </div>

            <button
                class="logout-btn"
                id="logoutBtn"
                type="button"
            >
                Log Out
            </button>

        </aside>

    </div>

</div>


<div class="toast" id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
